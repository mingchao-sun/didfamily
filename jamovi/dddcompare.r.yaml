---
name:  dddcompare
title: Triple Differences (DDD)
jrs:   '1.1'

items:
    - name: guide
      title: Data and setup guide
      type: Html
      visible: (showGuide)

    - name: info
      title: Panel summary
      type: Html

    - name: summary
      title: Overall ATT
      type: Table
      rows: 0
      clearWith: [plotPalette, plotCI, plotDodge, dep, id, time, treat, part, covs, csControl, csMethod, ciLevel]
      columns:
        - name: method
          title: Estimator
          type: text
        - name: att
          title: ATT
          type: number
        - name: se
          title: SE
          type: number
        - name: lower
          title: Lower
          type: number
          superTitle: Confidence interval
        - name: upper
          title: Upper
          type: number
          superTitle: Confidence interval
        - name: p
          title: p
          type: number
          format: zto,pvalue
        - name: control
          title: Comparison group
          type: text
        - name: note
          title: Note
          type: text
      refs:
        - ortiz2025
        - triplediff
        - callaway2021
        - did


    - name: dynamic
      title: Dynamic effects by event time (reference period = -1)
      type: Table
      rows: 0
      clearWith: [plotPalette, plotCI, plotDodge, dep, id, time, treat, part, covs, csControl, csMethod, minE, maxE]
      columns:
        - name: e
          title: Event time
          type: integer
        - name: ddd_est
          title: Estimate
          type: number
          superTitle: Triple difference (DDD)
        - name: ddd_se
          title: SE
          type: number
          superTitle: Triple difference (DDD)
        - name: elig_est
          title: Estimate
          type: number
          superTitle: DiD, eligible only
        - name: elig_se
          title: SE
          type: number
          superTitle: DiD, eligible only
        - name: inel_est
          title: Estimate
          type: number
          superTitle: DiD, ineligible only
        - name: inel_se
          title: SE
          type: number
          superTitle: DiD, ineligible only

    - name: plot
      title: Event study comparison
      type: Image
      width: 720
      height: 450
      renderFun: .plot
      clearWith: [plotPalette, plotCI, plotDodge, dep, id, time, treat, part, covs, csControl, csMethod, minE, maxE, ciLevel]

    - name: notes
      title: How to read these results
      type: Html
      visible: (showHelp)

...
