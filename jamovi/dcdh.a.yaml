---
name:  dcdh
title: Dynamic DiD for Treatments that Switch
menuGroup: DiD
menuSubgroup: Diagnostics and extensions
menuTitle: Treatment Switching On and Off
menuSubtitle: de Chaisemartin and D'Haultfoeuille
version: '1.0.0'
jas: '1.2'

description:
    main: 'Dynamic effects of a binary treatment that can switch on and off, with placebo tests (de Chaisemartin and D''Haultfoeuille, 2024).'
    R:
        dontrun: true
        usage: |
            # d is a data frame with one row per group and period
            dcdh(data = d, dep = 'y', id = 'id', time = 'year', treat = 'D', effects = 3, placebo = 2)

options:
    - name: data
      type: Data

    - name: dep
      title: Outcome
      type: Variable
      permitted: [numeric]
      description:
          R: 'a string naming the outcome variable in `data`'

    - name: id
      title: Group ID
      type: Variable
      permitted: [numeric, factor, id]
      description:
          R: 'a string naming the group (unit) identifier variable in `data`'

    - name: time
      title: Time period
      type: Variable
      permitted: [numeric]
      description:
          R: 'a string naming the period variable in `data`; whole numbers, consecutive'

    - name: treat
      title: Treatment (0/1)
      type: Variable
      permitted: [numeric, factor, id]
      description:
          R: 'a string naming the binary treatment variable in `data`; it may switch on and off'

    - name: effects
      title: Number of effects
      type: Integer
      default: 3
      min: 1
      max: 15
      description:
          R: 'number of dynamic effects to estimate (1 = the effect in the period of the first change)'

    - name: placebo
      title: Number of placebos
      type: Integer
      default: 2
      min: 0
      max: 10
      description:
          R: 'number of placebo estimates (pre-trend tests)'

    - name: level
      title: Confidence level (%)
      type: Number
      default: 95
      min: 50
      max: 99.9
      description:
          R: 'confidence level in percent'

    - name: plot
      title: Event study plot
      type: Bool
      default: true
      description:
          R: '`TRUE` (default) or `FALSE`, draw the effects and placebos'

    - name: plotPalette
      title: Plot colors
      type: List
      options:
        - title: Colors (colour-blind safe)
          name: color
        - title: Grayscale (for printing)
          name: gray
      default: color
      description:
          R: '`''color''` (default) or `''gray''`'

    - name: showHelp
      title: Method notes
      type: Bool
      default: false
      description:
          R: '`TRUE` or `FALSE` (default), show notes on the method'

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false
      description:
          R: '`TRUE` or `FALSE` (default), show a guide to the variables and the data format'

...
