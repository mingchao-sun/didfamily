---
name:  did22
title: Classic DiD (2x2)
jrs:   '1.1'

items:
    - name: guide
      title: Data and setup guide
      type: Html
      visible: (showGuide)

    - name: info
      title: Data summary
      type: Html

    - name: means
      title: Mean outcome by group and period
      type: Table
      rows: 0
      clearWith: [plotPalette, dep, group, period, id, covs]
      columns:
        - name: group
          title: Group
          type: text
        - name: pre
          title: Before
          type: number
        - name: post
          title: After
          type: number
        - name: change
          title: Change
          type: number
        - name: n
          title: Observations
          type: integer

    - name: summary
      title: DiD estimates (effect on the treated)
      type: Table
      rows: 0
      clearWith: [plotPalette, dep, group, period, id, covs, ols, dr, drtrad, ipw, or, ciLevel]
      columns:
        - name: method
          title: Estimator
          type: text
        - name: att
          title: ATT
          type: number
        - name: se
          title: SE
          type: number
        - name: lower
          title: Lower
          type: number
          superTitle: Confidence interval
        - name: upper
          title: Upper
          type: number
          superTitle: Confidence interval
        - name: p
          title: p
          type: number
          format: zto,pvalue
        - name: note
          title: Note
          type: text
      refs:
        - santanna2020
        - DRDID


    - name: plot
      title: Group means before and after
      type: Image
      width: 560
      height: 400
      renderFun: .plot
      clearWith: [plotPalette, dep, group, period, id, covs]

    - name: notes
      title: How to read these results
      type: Html
      visible: (showHelp)

...
