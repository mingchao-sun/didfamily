---
name:  did22
title: Classic DiD (2x2)
menuGroup: DiD
menuTitle: Classic DiD (2x2)
version: '1.0.0'
jas: '1.2'

description:
    main: 'Classic two-group, two-period difference-in-differences: group means, regression DiD and doubly robust, IPW and outcome-regression estimators.'
    R:
        dontrun: true
        usage: |
            # d is a data frame with one row per unit and period
            did22(data = d, dep = 'y', group = 'treated', period = 'year', id = 'id', covs = 'x')

options:
    - name: data
      type: Data

    - name: dep
      title: Outcome
      type: Variable
      permitted: [numeric]
      description:
          R: 'a string naming the outcome variable in `data`'

    - name: group
      title: Treated group (0/1)
      type: Variable
      permitted: [numeric, factor, id]
      description:
          R: 'a string naming the 0/1 variable that marks the treated group'

    - name: period
      title: Period (two values)
      type: Variable
      permitted: [numeric, factor, id]
      description:
          R: 'a string naming a variable with exactly two values; the later (or last) value is the post period'

    - name: id
      title: Unit ID (optional, panel data)
      type: Variable
      permitted: [numeric, factor, id]
      default: null
      description:
          R: 'a string naming the unit identifier variable in `data`'

    - name: covs
      title: Covariates
      type: Variables
      permitted: [numeric, factor]
      default: null
      description:
          R: 'a vector of strings naming covariates in `data` (optional); text and factor variables are dummy-coded'

    - name: ols
      title: Regression DiD (OLS)
      type: Bool
      default: true
      description:
          R: '`TRUE` (default) or `FALSE`, regression difference-in-differences'

    - name: dr
      title: Doubly robust (improved)
      type: Bool
      default: true
      description:
          R: '`TRUE` (default) or `FALSE`, improved doubly robust estimator'

    - name: drtrad
      title: Doubly robust (traditional)
      type: Bool
      default: false
      description:
          R: '`TRUE` or `FALSE` (default), traditional doubly robust estimator'

    - name: ipw
      title: Inverse probability weighting
      type: Bool
      default: true
      description:
          R: '`TRUE` (default) or `FALSE`, inverse probability weighting estimator'

    - name: or
      title: Outcome regression
      type: Bool
      default: true
      description:
          R: '`TRUE` (default) or `FALSE`, outcome regression estimator'

    - name: ciLevel
      title: Confidence level (%)
      type: Number
      min: 50
      max: 99.9
      default: 95
      description:
          R: 'the confidence level in percent (default 95)'

    - name: plotPalette
      title: Plot colors
      type: List
      options:
        - title: Colors (colour-blind safe)
          name: color
        - title: Grayscale (for printing)
          name: gray
      default: color
      description:
          R: '`''color''` (default, colour-blind safe) or `''gray''` (shades, shapes and line types for printing)'

    - name: showHelp
      title: Method notes
      type: Bool
      default: false
      description:
          R: '`TRUE` or `FALSE` (default), show notes on what the method does and how to read the results'

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false
      description:
          R: '`TRUE` or `FALSE` (default), show a guide to the variables and the data format'

...
