---
name:  didcompare
title: Compare DiD Estimators
jrs:   '1.1'

items:
    - name: guide
      title: Data and setup guide
      type: Html
      visible: (showGuide)

    - name: info
      title: Panel summary
      type: Html

    - name: summary
      title: Overall ATT by estimator
      type: Table
      rows: 0
      clearWith: [plotPalette, plotCI, plotDodge, dep, id, time, treat, treatType, weights, covs, csMethod, cluster, bootstrap, bootReps, seed, twfe, cs, sa, bjs, gardner, stacked, csControl, ciLevel]
      columns:
        - name: method
          title: Estimator
          type: text
        - name: att
          title: ATT
          type: number
        - name: se
          title: SE
          type: number
        - name: lower
          title: Lower
          type: number
          superTitle: Confidence interval
        - name: upper
          title: Upper
          type: number
          superTitle: Confidence interval
        - name: p
          title: p
          type: number
          format: zto,pvalue
        - name: control
          title: Comparison group
          type: text
        - name: nobs
          title: Observations
          type: integer
        - name: ncl
          title: Clusters
          type: integer
        - name: note
          title: Note
          type: text
      refs:
        - callaway2021
        - sun2021
        - borusyak2024
        - gardner2022
        - cengiz2019
        - did
        - fixest
        - didimputation
        - did2s


    - name: dynamic
      title: Dynamic effects by event time (reference period = -1)
      type: Table
      rows: 0
      clearWith: [plotPalette, plotCI, plotDodge, dep, id, time, treat, treatType, weights, covs, csMethod, cluster, bootstrap, bootReps, seed, twfe, cs, sa, bjs, gardner, stacked, csControl, minE, maxE]
      columns:
        - name: e
          title: Event time
          type: integer
        - name: twfe_est
          title: Estimate
          type: number
          superTitle: TWFE
          visible: (twfe)
        - name: twfe_se
          title: SE
          type: number
          superTitle: TWFE
          visible: (twfe)
        - name: cs_est
          title: Estimate
          type: number
          superTitle: Callaway-Sant'Anna
          visible: (cs)
        - name: cs_se
          title: SE
          type: number
          superTitle: Callaway-Sant'Anna
          visible: (cs)
        - name: sa_est
          title: Estimate
          type: number
          superTitle: Sun-Abraham
          visible: (sa)
        - name: sa_se
          title: SE
          type: number
          superTitle: Sun-Abraham
          visible: (sa)
        - name: bjs_est
          title: Estimate
          type: number
          superTitle: Borusyak-Jaravel-Spiess
          visible: (bjs)
        - name: bjs_se
          title: SE
          type: number
          superTitle: Borusyak-Jaravel-Spiess
          visible: (bjs)
        - name: gardner_est
          title: Estimate
          type: number
          superTitle: Gardner (did2s)
          visible: (gardner)
        - name: gardner_se
          title: SE
          type: number
          superTitle: Gardner (did2s)
          visible: (gardner)
        - name: stacked_est
          title: Estimate
          type: number
          superTitle: Stacked DiD
          visible: (stacked)
        - name: stacked_se
          title: SE
          type: number
          superTitle: Stacked DiD
          visible: (stacked)

    - name: plot
      title: Event study comparison
      type: Image
      width: 720
      height: 450
      renderFun: .plot
      clearWith: [plotPalette, plotCI, plotDodge, dep, id, time, treat, treatType, weights, covs, csMethod, cluster, bootstrap, bootReps, seed, twfe, cs, sa, bjs, gardner, stacked, csControl, minE, maxE, ciLevel]

    - name: forest
      title: Overall ATT by estimator
      type: Image
      visible: (showForest)
      width: 640
      height: 330
      renderFun: .plotForest
      clearWith: [plotPalette, plotCI, plotDodge, dep, id, time, treat, treatType, weights, covs, csMethod, cluster, bootstrap, bootReps, seed, twfe, cs, sa, bjs, gardner, stacked, csControl, minE, maxE, ciLevel]

    - name: groupTab
      title: Callaway & Sant'Anna effects by cohort
      type: Table
      visible: (aggGroup)
      rows: 0
      clearWith: [plotPalette, plotCI, plotDodge, dep, id, time, treat, treatType, weights, covs, csMethod, cluster, bootstrap, bootReps, seed, cs, csControl, ciLevel]
      columns:
        - name: g
          title: Cohort (first treated period)
          type: text
        - name: est
          title: Estimate
          type: number
        - name: se
          title: SE
          type: number
        - name: lower
          title: Lower
          type: number
          superTitle: Confidence interval
        - name: upper
          title: Upper
          type: number
          superTitle: Confidence interval

    - name: calTab
      title: Callaway & Sant'Anna effects by calendar time
      type: Table
      visible: (aggCalendar)
      rows: 0
      clearWith: [plotPalette, plotCI, plotDodge, dep, id, time, treat, treatType, weights, covs, csMethod, cluster, bootstrap, bootReps, seed, cs, csControl, ciLevel]
      columns:
        - name: t
          title: Period
          type: text
        - name: est
          title: Estimate
          type: number
        - name: se
          title: SE
          type: number
        - name: lower
          title: Lower
          type: number
          superTitle: Confidence interval
        - name: upper
          title: Upper
          type: number
          superTitle: Confidence interval

    - name: gtPlot
      title: Callaway & Sant'Anna group-time effects
      type: Image
      visible: (showGT)
      width: 640
      height: 420
      renderFun: .plotGT
      clearWith: [plotPalette, plotCI, plotDodge, dep, id, time, treat, treatType, weights, covs, csMethod, cluster, bootstrap, bootReps, seed, cs, csControl]

    - name: code
      title: Reproducible R code
      type: Preformatted
      visible: (showCode)

    - name: notes
      title: What each estimator estimates
      type: Html
      visible: (showHelp)
      refs:
        - roth2023


...
