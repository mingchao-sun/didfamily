title: Triple Differences (DDD)
name: dddcompare
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    permitted:
      - numeric
      - factor
      - id
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Outcome
        children:
          - type: VariablesListBox
            name: dep
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Unit ID
        children:
          - type: VariablesListBox
            name: id
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Time period
        children:
          - type: VariablesListBox
            name: time
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: First treated period
        children:
          - type: VariablesListBox
            name: treat
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Eligibility (0/1)
        children:
          - type: VariablesListBox
            name: part
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Covariates
        children:
          - type: VariablesListBox
            name: covs
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: csControl
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: csMethod
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: minE
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: maxE
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: ciLevel
        format: number
  - type: CollapseBox
    label: Plot style
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: plotPalette
          - type: ComboBox
            name: plotCI
          - type: TextBox
            name: plotDodge
            format: number
  - type: CollapseBox
    label: Notes and guide
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: showHelp
          - type: CheckBox
            name: showGuide
