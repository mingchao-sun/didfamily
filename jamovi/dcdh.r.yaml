---
name:  dcdh
title: Dynamic DiD for Treatments that Switch
jrs:   '1.1'

items:
    - name: guide
      title: Data and setup guide
      type: Html
      visible: (showGuide)

    - name: notes
      title: Method notes
      type: Html
      visible: (showHelp)

    - name: info
      title: Panel
      type: Html

    - name: effects
      title: Dynamic effects and placebos
      type: Table
      rows: 0
      clearWith: [dep, id, time, treat, effects, placebo, level]
      columns:
        - name: label
          title: ''
          type: text
        - name: lag
          title: 'Periods from the switch'
          type: text
        - name: estimate
          title: Estimate
          type: number
        - name: se
          title: Std. error
          type: number
        - name: lo
          title: CI lower
          type: number
        - name: hi
          title: CI upper
          type: number
        - name: p
          title: p
          type: number
          format: zto,pvalue
        - name: n
          title: Switchers
          type: integer
      refs:
        - dcdh2024

    - name: tests
      title: Joint tests
      type: Table
      rows: 0
      clearWith: [dep, id, time, treat, effects, placebo]
      columns:
        - name: test
          title: Null hypothesis
          type: text
        - name: chi
          title: Chi-squared
          type: number
        - name: df
          title: df
          type: integer
        - name: p
          title: p
          type: number
          format: zto,pvalue

    - name: plot
      title: Effects and placebos by distance to the first switch
      type: Image
      width: 600
      height: 400
      renderFun: .plot
      visible: (plot)
      clearWith: [dep, id, time, treat, effects, placebo, level, plotPalette]

refs:
    - dcdh2024

...
