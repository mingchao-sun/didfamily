---
name:  didiag
title: Bacon, Pre-trend and HonestDiD
menuGroup: DiD
menuSubgroup: Diagnostics and extensions
menuTitle: Bacon, Pre-trend and HonestDiD
version: '1.0.0'
jas: '1.2'

description:
    main: 'Diagnostics for staggered-adoption designs: Goodman-Bacon decomposition, TWFE weights, joint pre-trend tests and HonestDiD sensitivity analysis.'
    R:
        dontrun: true
        usage: |
            # d is a data frame with one row per unit and period
            didiag(data = d, dep = 'y', id = 'id', time = 'year', treat = 'D')

options:
    - name: data
      type: Data

    - name: dep
      title: Outcome
      type: Variable
      permitted: [numeric]
      description:
          R: 'a string naming the outcome variable in `data`'

    - name: id
      title: Unit ID
      type: Variable
      permitted: [numeric, factor, id]
      description:
          R: 'a string naming the unit identifier variable in `data`'

    - name: time
      title: Time period
      type: Variable
      permitted: [numeric]
      description:
          R: 'a string naming the period variable in `data`; values must be integers (a year or a period number)'

    - name: treat
      title: Treatment variable
      type: Variable
      permitted: [numeric, factor, id]
      description:
          R: 'a string naming the treatment variable in `data`: a 0/1 indicator that never turns off, or the first treated period (see `treatType`)'

    - name: treatType
      title: Treatment variable is
      type: List
      options:
        - title: Treatment indicator D (0/1)
          name: indicator
        - title: First treated period (0 or missing = never)
          name: cohort
      default: indicator
      description:
          R: '`''indicator''` (default) if `treat` is a 0/1 treatment indicator, or `''cohort''` if it holds the first treated period (0 or missing = never treated)'

    - name: bacon
      title: Goodman-Bacon decomposition
      type: Bool
      default: true
      description:
          R: '`TRUE` (default) or `FALSE`, Goodman-Bacon decomposition of the static TWFE estimate (balanced panels)'

    - name: weights
      title: TWFE weights on treated observations
      type: Bool
      default: true
      description:
          R: '`TRUE` (default) or `FALSE`, weights that the static TWFE estimate puts on treated observations'

    - name: pretest
      title: Joint pre-trend tests
      type: Bool
      default: true
      description:
          R: '`TRUE` (default) or `FALSE`, joint Wald tests that the pre-treatment effects are zero'

    - name: honest
      title: HonestDiD sensitivity analysis (slow)
      type: Bool
      default: false
      description:
          R: '`TRUE` or `FALSE` (default), HonestDiD sensitivity analysis with relative-magnitude restrictions (slow)'

    - name: honestBase
      title: Event study to analyse
      type: List
      options:
        - title: Callaway & Sant'Anna
          name: cs
        - title: Sun & Abraham
          name: sa
      default: cs
      description:
          R: '`''cs''` (default) or `''sa''`, the event study the sensitivity analysis is based on'

    - name: honestTarget
      title: Effect of interest
      type: List
      options:
        - title: First post-treatment period (e = 0)
          name: first
        - title: Average of post-treatment periods
          name: average
      default: first
      description:
          R: '`''first''` (default, first post-treatment period) or `''average''` (average of the post-treatment periods)'

    - name: honestMbar
      title: Largest relative magnitude (Mbar)
      type: Number
      min: 0.1
      max: 10
      default: 2
      description:
          R: 'the largest relative magnitude Mbar of the grid (default 2)'

    - name: ptpower
      title: Power of the pre-trend test (Roth 2022)
      type: Bool
      default: false
      description:
          R: '`TRUE` or `FALSE` (default), compute the power of the conventional pre-trend test against a hypothesized linear violation of parallel trends'

    - name: ptBase
      title: Event study to analyse
      type: List
      options:
        - title: Callaway & Sant'Anna
          name: cs
        - title: Sun & Abraham
          name: sa
      default: sa
      description:
          R: '`''sa''` (default) or `''cs''`, the event study the pre-trend power is computed for'

    - name: ptSlope
      title: Hypothesized trend (slope per period)
      type: Number
      default: 0
      description:
          R: 'the slope per event period of the linear violation of parallel trends to detect; 0 (default) reports only the slopes that the test detects with 50 and 80 percent power'

    - name: csControl
      title: Callaway & Sant'Anna control group
      type: List
      options:
        - title: Never treated
          name: nevertreated
        - title: Not yet treated
          name: notyettreated
      default: nevertreated
      description:
          R: '`''nevertreated''` (default) or `''notyettreated''`, the control group used by Callaway and Sant''Anna'

    - name: minE
      title: Event window, from
      type: Integer
      min: -50
      max: -1
      default: -4
      description:
          R: 'the most negative event time shown (default -4)'

    - name: maxE
      title: Event window, to
      type: Integer
      min: 0
      max: 50
      default: 4
      description:
          R: 'the largest event time shown (default 4)'

    - name: ciLevel
      title: Confidence level (%)
      type: Number
      min: 50
      max: 99.9
      default: 95
      description:
          R: 'the confidence level in percent (default 95)'

    - name: plotPalette
      title: Plot colors
      type: List
      options:
        - title: Colors (colour-blind safe)
          name: color
        - title: Grayscale (for printing)
          name: gray
      default: color
      description:
          R: '`''color''` (default, colour-blind safe) or `''gray''` (shades, shapes and line types for printing)'

    - name: showHelp
      title: Method notes
      type: Bool
      default: false
      description:
          R: '`TRUE` or `FALSE` (default), show notes on what the method does and how to read the results'

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false
      description:
          R: '`TRUE` or `FALSE` (default), show a guide to the variables and the data format'

...
