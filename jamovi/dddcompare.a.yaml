---
name:  dddcompare
title: Triple Differences (DDD)
menuGroup: DiD
menuSubgroup: Diagnostics and extensions
menuTitle: Triple Differences (DDD)
version: '1.0.0'
jas: '1.2'

description:
    main: 'Triple differences with an eligibility variable, shown next to difference-in-differences on eligible-only and ineligible-only units.'
    R:
        dontrun: true
        usage: |
            # d is a data frame with one row per unit and period
            dddcompare(data = d, dep = 'y', id = 'id', time = 'year', treat = 'g', part = 'elig')

options:
    - name: data
      type: Data

    - name: dep
      title: Outcome
      type: Variable
      permitted: [numeric]
      description:
          R: 'a string naming the outcome variable in `data`'

    - name: id
      title: Unit ID
      type: Variable
      permitted: [numeric, factor, id]
      description:
          R: 'a string naming the unit identifier variable in `data`'

    - name: time
      title: Time period
      type: Variable
      permitted: [numeric]
      description:
          R: 'a string naming the period variable in `data`; values must be integers (a year or a period number)'

    - name: treat
      title: First treated period
      type: Variable
      permitted: [numeric, factor, id]
      description:
          R: 'a string naming the treatment variable in `data`: a 0/1 indicator that never turns off, or the first treated period (see `treatType`)'

    - name: part
      title: Eligibility (0/1)
      type: Variable
      permitted: [numeric, factor, id]
      description:
          R: 'a string naming the 0/1 eligibility variable in `data`; it must be constant within units'

    - name: covs
      title: Covariates
      type: Variables
      permitted: [numeric, factor]
      default: null
      description:
          R: 'a vector of strings naming covariates in `data` (optional); text and factor variables are dummy-coded'

    - name: csControl
      title: Control group
      type: List
      options:
        - title: Never-treated groups
          name: nevertreated
        - title: Not-yet-treated groups
          name: notyettreated
      default: nevertreated
      description:
          R: '`''nevertreated''` (default) or `''notyettreated''`, the control group used by Callaway and Sant''Anna'

    - name: csMethod
      title: Estimation method
      type: List
      options:
        - title: Doubly robust
          name: dr
        - title: Inverse probability weighting
          name: ipw
        - title: Outcome regression
          name: reg
      default: dr
      description:
          R: '`''dr''` (default), `''ipw''` or `''reg''`, the estimation method used with covariates'

    - name: minE
      title: Event window, from
      type: Integer
      min: -50
      max: -1
      default: -4
      description:
          R: 'the most negative event time shown (default -4)'

    - name: maxE
      title: Event window, to
      type: Integer
      min: 0
      max: 50
      default: 4
      description:
          R: 'the largest event time shown (default 4)'

    - name: ciLevel
      title: Confidence level (%)
      type: Number
      min: 50
      max: 99.9
      default: 95
      description:
          R: 'the confidence level in percent (default 95)'

    - name: plotPalette
      title: Plot colors
      type: List
      options:
        - title: Colors (colour-blind safe)
          name: color
        - title: Grayscale (for printing)
          name: gray
      default: color
      description:
          R: '`''color''` (default, colour-blind safe) or `''gray''` (shades, shapes and line types for printing)'

    - name: plotCI
      title: Show confidence intervals as
      type: List
      options:
        - title: Error bars
          name: bars
        - title: Shaded bands
          name: ribbon
      default: bars
      description:
          R: '`''bars''` (default) or `''ribbon''`, draw confidence intervals as error bars or shaded bands'

    - name: plotDodge
      title: Spacing between estimators (error bars)
      type: Number
      min: 0
      max: 1
      default: 0.5
      description:
          R: 'the horizontal spacing between estimators when intervals are drawn as error bars (default 0.5)'

    - name: showHelp
      title: Method notes
      type: Bool
      default: false
      description:
          R: '`TRUE` or `FALSE` (default), show notes on what the method does and how to read the results'

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false
      description:
          R: '`TRUE` or `FALSE` (default), show a guide to the variables and the data format'

...
